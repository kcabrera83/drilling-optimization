site_name: Drilling Optimization
site_description: Real-time ROP prediction and torque/vibration monitoring for drilling operations optimization.
repo_url: https://github.com/kcabrera83/drilling-optimization
site_author: Kelvin J Cabrera

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top

nav:
  - Home: index.md
  - API Reference: api.md
  - Models: models.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
